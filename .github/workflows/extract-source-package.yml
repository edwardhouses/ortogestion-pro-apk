
name: Extract single-source package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and extract package
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="OrtoGestion-Pro-Fuente-Unica-Paquete.zip"
          test -f "$PACKAGE"

          mkdir -p _source_package
          unzip -q "$PACKAGE" -d _source_package

          echo "Contenido del paquete:"
          find _source_package -maxdepth 5 -type f -print | sort

          ROOT="_source_package"
          if [ ! -f "$ROOT/app/index.html" ]; then
            CANDIDATE="$(find "$ROOT" -mindepth 2 -maxdepth 4 -type f -path '*/app/index.html' -print -quit)"
            if [ -z "$CANDIDATE" ]; then
              echo "::error::No se encontró app/index.html"
              exit 1
            fi
            ROOT="$(dirname "$(dirname "$CANDIDATE")")"
          fi

          REQUIRED=(
            "app/index.html"
            ".github/workflows/build-all.yml"
            ".github/workflows/android-apk.yml"
            ".github/workflows/windows-portable.yml"
            "README-MIGRACION.md"
          )

          for file in "${REQUIRED[@]}"; do
            if [ ! -f "$ROOT/$file" ]; then
              echo "::error::Falta el archivo requerido: $file"
              exit 1
            fi
          done

          mkdir -p app .github/workflows

          cp "$ROOT/app/index.html" app/index.html
          cp "$ROOT/.github/workflows/build-all.yml" .github/workflows/build-all.yml
          cp "$ROOT/.github/workflows/android-apk.yml" .github/workflows/android-apk.yml
          cp "$ROOT/.github/workflows/windows-portable.yml" .github/workflows/windows-portable.yml
          cp "$ROOT/README-MIGRACION.md" README-MIGRACION.md

          echo "SHA-256 del HTML:"
          sha256sum app/index.html

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/index.html \
            .github/workflows/build-all.yml \
            .github/workflows/android-apk.yml \
            .github/workflows/windows-portable.yml \
            README-MIGRACION.md

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
            exit 0
          fi

          git commit -m "Add canonical OrtoGestion Pro source"
          git push
