name: OrtoGestion Pro - Audit quality gate

on:
  push:
    branches:
      - 'audit/**'
    paths:
      - 'app/index.html'
      - 'OrtoGestion-Pro-Android-v2.1-cloud-build(2).zip'
      - 'OrtoGestion-Pro-Windows-Portable.zip'
      - '.github/workflows/audit-quality.yml'
      - 'native/android/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/index.html'
      - 'OrtoGestion-Pro-Android-v2.1-cloud-build(2).zip'
      - 'OrtoGestion-Pro-Windows-Portable.zip'
      - '.github/workflows/audit-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-wrapper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate HTML and inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s app/index.html
          mkdir -p audit/js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      attrs = dict(attrs)
                      self.current = [] if "src" not in attrs and attrs.get("type", "").lower() not in ("application/json", "application/ld+json", "importmap") else None

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      self.scripts.append("".join(self.current))
                      self.current = None

          source = Path("app/index.html").read_text(encoding="utf-8")
          parser = Scripts()
          parser.feed(source)
          if not parser.scripts:
              raise SystemExit("No se encontraron scripts JavaScript inline para validar.")
          for index, script in enumerate(parser.scripts, 1):
              Path(f"audit/js/inline-{index}.js").write_text(script, encoding="utf-8")
          print(f"Scripts inline encontrados: {len(parser.scripts)}")
          PY
          for file in audit/js/*.js; do
            echo "Comprobando sintaxis: $file"
            node --check "$file"
          done
          sha256sum app/index.html | tee audit/html-sha256.txt

      - name: Extract Android wrapper and run its test suite
        shell: bash
        run: |
          set -euo pipefail
          unzip -q 'OrtoGestion-Pro-Android-v2.1-cloud-build(2).zip' -d audit/android
          ROOT='audit/android/OrtoGestion-Pro-Android'
          test -f "$ROOT/tests/run-tests.sh"
          python3 native/android/harden_android.py "$ROOT"
          python3 native/android/test_hardening.py "$ROOT"
          bash "$ROOT/tests/run-tests.sh"

      - name: Extract Windows wrapper and run its test suite
        shell: bash
        run: |
          set -euo pipefail
          unzip -q 'OrtoGestion-Pro-Windows-Portable.zip' -d audit/windows
          ROOT='audit/windows/OrtoGestion-Pro-Windows-Portable'
          test -f "$ROOT/package.json"
          test -f "$ROOT/main.js"
          cd "$ROOT"
          npm install --no-audit --no-fund
          npm test

      - name: Inspect native wrapper configuration and security-sensitive source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          targets = [
              ("OrtoGestion-Pro-Android-v2.1-cloud-build(2).zip", (
                  "AndroidManifest.xml", "MainActivity.kt", ".java", ".kt",
                  "build.gradle.kts", "settings.gradle.kts", "gradle.properties",
                  "proguard-rules.pro"
              )),
              ("OrtoGestion-Pro-Windows-Portable.zip", (
                  "package.json", "main.js", "preload.js", ".config.js", ".yml", ".yaml"
              )),
          ]
          keywords = (
              "addJavascriptInterface", "setJavaScriptEnabled", "allowFileAccess",
              "allowContentAccess", "mixedContentMode", "WebViewClient", "WebChromeClient",
              "shouldOverrideUrlLoading", "onReceivedSslError", "usesCleartextTraffic",
              "networkSecurityConfig", "debuggable", "android:exported",
              "requestLegacyExternalStorage", "contextIsolation", "nodeIntegration",
              "webSecurity", "shell.openExternal", "will-navigate", "setWindowOpenHandler",
              "preload", "sandbox", "Content-Security-Policy", "unsafe-eval",
              "remote.require", "child_process", "exec("
          )
          out = []
          for archive, suffixes in targets:
              out.append(f"\n===== ARCHIVE: {archive} =====")
              with ZipFile(archive) as z:
                  names = z.namelist()
                  out.append("ARCHIVE INVENTORY:")
                  out.extend(sorted(names))
                  for name in sorted(names):
                      if not name.endswith(suffixes):
                          continue
                      if any(part in name.lower() for part in ("node_modules/", "build/", ".gradle/")):
                          continue
                      info = z.getinfo(name)
                      if info.file_size > 180000:
                          continue
                      try:
                          body = z.read(name).decode("utf-8")
                      except (UnicodeDecodeError, KeyError):
                          continue
                      out.append(f"\n----- FILE: {name} -----")
                      out.append(body[:24000])
                      for number, line in enumerate(body.splitlines(), 1):
                          hits = [word for word in keywords if word in line]
                          if hits:
                              out.append(f"[REVIEW {name}:{number}] {', '.join(hits)} :: {line.strip()[:400]}")
          report = "\n".join(out)
          Path("audit/native-wrapper-review.txt").write_text(report, encoding="utf-8")
          print(report[:110000])
          PY

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "## OrtoGestión Pro — control de calidad"
            echo ""
            echo "Este control valida sintaxis JavaScript y ejecuta las pruebas incluidas en los wrappers."
            echo "No sustituye pruebas clínicas, pruebas manuales de runtime, pentest ni validación regulatoria."
            echo ""
            if [ -f audit/html-sha256.txt ]; then
              echo 'HTML fuente:'
              cat audit/html-sha256.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrtoGestion-Audit-Quality-Evidence
          path: |
            audit/html-sha256.txt
            audit/native-wrapper-review.txt
            audit/js/
          if-no-files-found: warn
          retention-days: 14
