
name: Build OrtoGestion Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'OrtoGestion-Pro-Android-v2.1-cloud-build.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository contents
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |unzip -q 'OrtoGestion-Pro-Android-v2.1-cloud-build(2).zip' -d source
          test -f source/OrtoGestion-Pro-Android/settings.gradle.kts
          test -f source/OrtoGestion-Pro-Android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run application static tests
        working-directory: source/OrtoGestion-Pro-Android
        run: bash tests/run-tests.sh

      - name: Build debug APK
        working-directory: source/OrtoGestion-Pro-Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrtoGestion-Pro-2.1-debug-apk
          path: source/OrtoGestion-Pro-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
