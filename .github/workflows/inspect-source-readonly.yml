
name: Read-only Source and Configuration Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract original ZIP files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p audit/android audit/windows audit/report

          unzip -q 'OrtoGestion-Pro-Android-v2.1-cloud-build(2).zip' -d audit/android
          unzip -q 'OrtoGestion-Pro-Windows-Portable.zip' -d audit/windows

          test -f audit/android/OrtoGestion-Pro-Android/app/src/main/assets/www/index.html
          test -f audit/windows/OrtoGestion-Pro-Windows-Portable/www/index.html

      - name: Calculate HTML SHA-256
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_HTML="audit/android/OrtoGestion-Pro-Android/app/src/main/assets/www/index.html"
          WINDOWS_HTML="audit/windows/OrtoGestion-Pro-Windows-Portable/www/index.html"

          {
            echo "HTML SHA-256 AUDIT"
            echo "=================="
            echo ""
            sha256sum "$ANDROID_HTML"
            sha256sum "$WINDOWS_HTML"
            echo ""
            if cmp -s "$ANDROID_HTML" "$WINDOWS_HTML"; then
              echo "RESULT: IDENTICAL HTML FILES"
            else
              echo "RESULT: HTML FILES ARE DIFFERENT"
            fi
          } | tee audit/report/html-sha256.txt

      - name: Inspect Android configuration
        shell: bash
        run: |
          set -euo pipefail

          ROOT="audit/android/OrtoGestion-Pro-Android"
          REPORT="audit/report/android-configuration.txt"

          for file in \
            "settings.gradle.kts" \
            "build.gradle.kts" \
            "gradle.properties" \
            "app/build.gradle.kts" \
            "app/proguard-rules.pro" \
            "app/src/main/AndroidManifest.xml" \
            "app/src/main/java/com/ortogestion/pro/MainActivity.kt"
          do
            if [ -f "$ROOT/$file" ]; then
              {
                echo ""
                echo "========================================"
                echo "FILE: $file"
                echo "========================================"
                cat "$ROOT/$file"
              } >> "$REPORT"
            fi
          done

          cat "$REPORT"

      - name: Inspect Windows configuration
        shell: bash
        run: |
          set -euo pipefail

          ROOT="audit/windows/OrtoGestion-Pro-Windows-Portable"
          REPORT="audit/report/windows-configuration.txt"

          for file in \
            "package.json" \
            "main.js" \
            "windows-portable.yml"
          do
            if [ -f "$ROOT/$file" ]; then
              {
                echo ""
                echo "========================================"
                echo "FILE: $file"
                echo "========================================"
                cat "$ROOT/$file"
              } >> "$REPORT"
            fi
          done

          cat "$REPORT"

      - name: Create audit summary
        if: always()
        shell: bash
        run: |
          {
            echo "# OrtoGestión Pro - Read-only audit"
            echo ""
            echo "## HTML SHA-256"
            if [ -f audit/report/html-sha256.txt ]; then
              cat audit/report/html-sha256.txt
            else
              echo "No se pudo completar el cálculo."
            fi
            echo ""
            echo "## Archivos de configuración"
            echo "Los informes completos se encuentran en el artefacto descargable."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrtoGestion-ReadOnly-Audit
          path: audit/report/
          if-no-files-found: warn
          retention-days: 7
