name: Build OrtoGestion Pro APK and Windows Portable

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/index.html'
      - 'OrtoGestion-Pro-Android-v2.1-cloud-build(2).zip'
      - 'OrtoGestion-Pro-Windows-Portable.zip'
      - '.github/workflows/build-all.yml'
      - 'native/android/**'
      - 'native/windows/**'

permissions:
  contents: read

concurrency:
  group: ortogestion-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate canonical HTML and extract Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -s app/index.html
          mkdir -p source
          unzip -q 'OrtoGestion-Pro-Android-v2.1-cloud-build(2).zip' -d source
          ROOT='source/OrtoGestion-Pro-Android'
          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/app/build.gradle.kts"
          test -f "$ROOT/app/src/main/java/com/ortogestion/pro/MainActivity.kt"
          mkdir -p "$ROOT/app/src/main/assets/www"
          cp app/index.html "$ROOT/app/src/main/assets/www/index.html"
          cmp -s app/index.html "$ROOT/app/src/main/assets/www/index.html"
          python3 native/android/harden_android.py "$ROOT"
          python3 native/android/test_hardening.py "$ROOT"
          sha256sum app/index.html "$ROOT/app/src/main/assets/www/index.html"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Run Android static tests
        working-directory: source/OrtoGestion-Pro-Android
        run: bash tests/run-tests.sh

      - name: Build debug APK
        working-directory: source/OrtoGestion-Pro-Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrtoGestion-Pro-2.1-security-test-apk
          path: source/OrtoGestion-Pro-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate canonical HTML and extract Windows wrapper
        shell: pwsh
        run: |
          if (!(Test-Path 'app/index.html')) { throw 'No se encontró app/index.html, la fuente única.' }
          if (!(Test-Path 'OrtoGestion-Pro-Windows-Portable.zip')) { throw 'No se encontró el ZIP del wrapper Windows.' }
          Expand-Archive -LiteralPath 'OrtoGestion-Pro-Windows-Portable.zip' -DestinationPath 'source' -Force
          $root = 'source/OrtoGestion-Pro-Windows-Portable'
          if (!(Test-Path "$root/package.json")) { throw 'No se encontró package.json' }
          if (!(Test-Path "$root/main.js")) { throw 'No se encontró main.js' }
          New-Item -ItemType Directory -Force -Path "$root/www" | Out-Null
          Copy-Item -LiteralPath 'app/index.html' -Destination "$root/www/index.html" -Force
          $a = (Get-FileHash 'app/index.html' -Algorithm SHA256).Hash
          $b = (Get-FileHash "$root/www/index.html" -Algorithm SHA256).Hash
          if ($a -ne $b) { throw 'El HTML copiado no coincide con la fuente única.' }
          Write-Host "SHA256 HTML: $a"
          python native/windows/apply_windows_hardening.py $root
          python native/windows/test_hardening.py $root

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Windows dependencies
        working-directory: source/OrtoGestion-Pro-Windows-Portable
        run: npm install --no-audit --no-fund

      - name: Run Windows structural tests
        working-directory: source/OrtoGestion-Pro-Windows-Portable
        run: npm test

      - name: Build portable Windows EXE
        working-directory: source/OrtoGestion-Pro-Windows-Portable
        run: npm run dist:win

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: OrtoGestion-Pro-2.1-security-test-Windows-Portable
          path: source/OrtoGestion-Pro-Windows-Portable/dist/*.exe
          if-no-files-found: error
          retention-days: 14
