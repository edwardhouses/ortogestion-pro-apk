name: Build OrtoGestion Pro Windows Portable v2.2 (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate canonical HTML and extract Windows wrapper
        shell: pwsh
        run: |
          if (!(Test-Path 'app/index.html')) { throw 'No se encontró app/index.html, la fuente única.' }
          if (!(Test-Path 'OrtoGestion-Pro-Windows-Portable.zip')) { throw 'No se encontró el ZIP del wrapper Windows.' }
          Expand-Archive -LiteralPath 'OrtoGestion-Pro-Windows-Portable.zip' -DestinationPath 'source' -Force
          $root = 'source/OrtoGestion-Pro-Windows-Portable'
          if (!(Test-Path "$root/package.json")) { throw 'No se encontró package.json' }
          if (!(Test-Path "$root/main.js")) { throw 'No se encontró main.js' }
          New-Item -ItemType Directory -Force -Path "$root/www" | Out-Null
          Copy-Item -LiteralPath 'app/index.html' -Destination "$root/www/index.html" -Force
          $packagePath = "$root/package.json"
          $package = Get-Content -Raw $packagePath | ConvertFrom-Json
          $package.version = '2.2.0'
          $package | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $packagePath
          $a = (Get-FileHash 'app/index.html' -Algorithm SHA256).Hash
          $b = (Get-FileHash "$root/www/index.html" -Algorithm SHA256).Hash
          if ($a -ne $b) { throw 'El HTML copiado no coincide con la fuente única.' }
          Write-Host "SHA256 HTML: $a"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Windows dependencies
        working-directory: source/OrtoGestion-Pro-Windows-Portable
        run: npm install --no-audit --no-fund

      - name: Run Windows structural tests
        working-directory: source/OrtoGestion-Pro-Windows-Portable
        run: npm test

      - name: Build portable Windows EXE
        working-directory: source/OrtoGestion-Pro-Windows-Portable
        run: npm run dist:win
      - name: Normalize portable executable version name
        shell: pwsh
        working-directory: source/OrtoGestion-Pro-Windows-Portable
        run: |
          $exe = Get-ChildItem 'dist/*.exe' | Select-Object -First 1
          if (!$exe) { throw 'No se generó el EXE portátil.' }
          if ($exe.Name -ne 'OrtoGestion-Pro-2.2-portable-x64.exe') {
            Rename-Item -LiteralPath $exe.FullName -NewName 'OrtoGestion-Pro-2.2-portable-x64.exe' -Force
          }

      - name: Upload portable EXE
        uses: actions/upload-artifact@v6
        with:
          name: OrtoGestion-Pro-2.2-Windows-Portable
          path: source/OrtoGestion-Pro-Windows-Portable/dist/*.exe
          if-no-files-found: error
          retention-days: 30
