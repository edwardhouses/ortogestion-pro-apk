name: Inspect Android wrapper sources (read-only)

on:
  push:
    branches:
      - maintenance/android-wrapper-inspection-run
    paths:
      - '.github/workflows/inspect-android-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout inspection branch
        uses: actions/checkout@v7

      - name: Extract Android wrapper and discover native source files
        shell: bash
        run: |
          set -euo pipefail
          ZIP='OrtoGestion-Pro-Android-v2.1-cloud-build(2).zip'
          test -s "$ZIP"
          mkdir -p source inspection
          unzip -q "$ZIP" -d source

          MAIN="$(find source -type f -name MainActivity.kt -print -quit)"
          MANIFEST="$(find source -type f -name AndroidManifest.xml -print -quit)"
          APP_GRADLE="$(find source -type f -path '*/app/build.gradle.kts' -print -quit)"
          test -n "$MAIN" && test -f "$MAIN"
          test -n "$MANIFEST" && test -f "$MANIFEST"
          test -n "$APP_GRADLE" && test -f "$APP_GRADLE"

          ROOT="$(dirname "$(dirname "$APP_GRADLE")")"
          cp "$MAIN" inspection/MainActivity.kt
          cp "$MANIFEST" inspection/AndroidManifest.xml
          cp "$APP_GRADLE" inspection/app-build.gradle.kts

          for file in "$ROOT/settings.gradle.kts" "$ROOT/build.gradle.kts" "$ROOT/gradle/libs.versions.toml" "$ROOT/gradle/wrapper/gradle-wrapper.properties"; do
            if [ -f "$file" ]; then
              cp "$file" "inspection/$(basename "$file")"
            fi
          done

          MAIN_DIR="$(dirname "$MAIN")"
          find "$ROOT/app/src/main" -maxdepth 6 -type f 2>/dev/null | sort > inspection/android-main-file-inventory.txt || true
          find "$ROOT" -maxdepth 4 -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle.properties' \) | sort > inspection/gradle-file-inventory.txt
          printf 'MainActivity: %s\nManifest: %s\nApp Gradle: %s\nProject root: %s\n' "$MAIN" "$MANIFEST" "$APP_GRADLE" "$ROOT" > inspection/source-locations.txt
          echo "Collected integration sources:"
          find inspection -type f -maxdepth 5 -print | sort

      - name: Upload read-only source inspection
        uses: actions/upload-artifact@v6
        with:
          name: OrtoGestion-Android-Wrapper-Inspection
          path: inspection/
          if-no-files-found: error
          retention-days: 7
